Name: Arrakis
Author: tanuj
SourceUrl: https://github.com/tanujp99/Arrakis
ShortDescription: A catalog-first fork of Dune for Playnite Desktop Mode.
Description: A fork of sakasaki's Dune theme, reshaped for using Playnite as a catalog of owned games rather than as a launcher. The grid view overview panel is a single narrow column of cards -- Play Stats, Details and How Long To Beat -- with the play, install and context actions removed. Grid tiles can carry eShop-style platform banners via the ThemeExtras plugin. Keeps Dune's light and dark modes intact.
Tags: ["Theme", "Light", "Clean", "Catalog"]
